name: Refresh anthology and deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: acl-org/acl-anthology
          ref: master
          path: anthology
          sparse-checkout: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py anthology
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy


